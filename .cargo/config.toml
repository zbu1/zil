# The browser build: wasm's default 1 MB stack can overflow, silently corrupting memory, before interp::MAX_DEPTH stops recursion.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]

[alias]
# The browser build's wasm (`pnpm wasm` runs wasm-bindgen on it).
wasm = "build -p zil-wasm --profile wasm --target wasm32-unknown-unknown"

# Link the C runtime statically, so zil.exe runs on machines without the Visual C++ Redistributable.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
