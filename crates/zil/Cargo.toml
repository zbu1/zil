[package]
name = "zil"
description = "A terse calculator and scripting language for units, dates and much more"
readme = "../../README.md"
keywords = ["calculator", "units", "scripting", "language"]
categories = ["mathematics"]
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["full"]
full = ["art", "crypto", "data-charts", "dev", "finance", "forensics", "fs", "geo", "regex-unicode", "sys", "text-extras"]
# Figlet fonts, images and QR codes.
art = ["dep:image", "dep:qrcode", "dev"]
# Tokens, URLs, versions, networks, IDs, colors and binaries.
dev = ["dep:cpp_demangle", "dep:iced-x86", "dep:object", "dep:rustc-demangle"]
# AES, DES, ChaCha20 and RC4.
crypto = ["dep:aes", "dep:aes-gcm", "dep:chacha20", "dep:des"]
finance = []
# File signatures, compression, archives and carving.
forensics = ["dep:bzip2", "dep:lzma-rs", "dep:miniz_oxide", "dep:ruzstd", "dep:sevenz-rust2", "dev"]
# Files and folders.
fs = []
# Arguments, env vars, programs, the clipboard and HTTP.
sys = []
# Countries and cities.
geo = []
# Bar, line and other text charts.
data-charts = []
# Ciphers, placeholder text and fancy Unicode letters.
text-extras = []
# Unicode `\w`, `\d`, `\p{..}` and case folding in user regexes.
regex-unicode = ["regex/unicode"]

[dependencies]
ariadne = "0.6.0"
base64 = "0.23.1"
fastrand = "2.5.0"
getrandom = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"], optional = true }
indexmap = "2.14.2"
jiff = "0.2.38"
logos = "0.16.1"
md-5 = "0.11.0"
num-bigint = "0.4"
num-integer = "0.1.47"
num-rational = "0.4.2"
num-traits = "0.2.19"
qrcode = { version = "0.14.1", default-features = false, optional = true }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
unicode-width = "0.2.2"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"], optional = true }
zil-macros = { path = "../zil-macros", version = "0.5.0" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "op_code_info", "instr_info", "intel", "gas"], optional = true }
rustc-demangle = { version = "0.1.28", default-features = false, optional = true }
cpp_demangle = { version = "0.5.1", optional = true }
miniz_oxide = { version = "0.9.1", optional = true }
lzma-rs = { version = "0.3.0", optional = true }
ruzstd = { version = "0.9.1", optional = true }
bzip2 = { version = "0.6.1", optional = true }
aes = { version = "0.9.3", optional = true }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"], optional = true }
des = { version = "0.9.0", optional = true }
chacha20 = { version = "0.10.2", optional = true }
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["compress", "aes256"], optional = true }

# The browser build: randomness, clock and time zones come from JS and a bundled tzdb.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fastrand = { version = "2.5.0", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
jiff = { version = "0.2.38", features = ["js", "tzdb-bundle-always"] }

[lints]
workspace = true
