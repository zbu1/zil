[package]
name = "zil"
description = "A terse calculator and scripting language for units, dates and much more"
readme = "../../README.md"
keywords = ["calculator", "units", "scripting", "language"]
categories = ["mathematics"]
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
ariadne = "0.6.0"
base64 = "0.23.1"
fastrand = "2.5.0"
getrandom = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
indexmap = "2.14.2"
jiff = "0.2.38"
logos = "0.16.1"
md-5 = "0.11.0"
num-bigint = "0.4"
num-integer = "0.1.47"
num-rational = "0.4.2"
num-traits = "0.2.19"
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"
unicode-width = "0.2.2"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }

# The browser build: randomness, clock and time zones come from JS and a bundled tzdb.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fastrand = { version = "2.5.0", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
jiff = { version = "0.2.38", features = ["js", "tzdb-bundle-always"] }

[lints]
workspace = true
