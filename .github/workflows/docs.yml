name: docs
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      # Must match the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen@0.2.129 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Not wrangler-action: it runs `pnpm add wrangler`, which pnpm refuses at a workspace root.
      - run: npx -y wrangler@4 pages deploy site --project-name=zil --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
