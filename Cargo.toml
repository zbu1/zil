[workspace]
members = ["crates/*"]
default-members = ["crates/zil", "crates/zil-cli"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
repository = "https://github.com/zbu1/zil"
license = "MIT"

[workspace.lints.clippy]
mod_module_files = "deny"

# The browser build (`cargo wasm`): smallest download over speed. The CLI keeps the plain release profile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
